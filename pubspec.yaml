name: aero_download_manager
description: "Aero Download Manager — multi-threaded downloads, BitTorrent and a built-in browser."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  dynamic_color: ^2.1.0
  flutter_local_notifications: ^22.3.3
  file_picker: ^13.2.0
  open_filex: ^5.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  flutter_inappwebview: ^6.1.5
  dtorrent_task: ^0.4.1
  dtorrent_parser: ^1.0.9
  dtorrent_tracker: ^1.3.20
  dtorrent_common: ^1.0.8
  b_encode_decode: ^1.0.5
  events_emitter2: ^1.0.4
  logging: ^1.3.0

dependency_overrides:
  dart_ipify:
    path: third_party/dart_ipify

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
